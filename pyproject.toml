[project]
name = "api-rest-test-helper"
version = "0.1.0"
description = "Desktop helper for building, importing (cURL) and running HTTP API requests"
requires-python = ">=3.12"
dependencies = [
    "pyside6==6.9.0",
    "requests",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["services", "view"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
